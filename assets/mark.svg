<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Annotate Kit">
  <!--
    The mark, in AnnotateKit's language: an element caught in a dashed
    selection with four rounded handles, and a numbered pin hanging off the top
    edge. Same drawing as the iOS kit — the only thing that changes is what is
    being selected, a card there, a browser window here.

    Laid out on a 4px grid at 96 so it survives 16, 24, 32 and 48.
  -->
  <!-- the element -->
  <rect x="22" y="26" width="52" height="44" rx="8" fill="#FFFFFF" stroke="#D7D9DE" stroke-width="2" />
  <g fill="#D7D9DE">
    <circle cx="30" cy="35" r="2" />
    <circle cx="37" cy="35" r="2" />
    <circle cx="44" cy="35" r="2" />
  </g>
  <g fill="#D7D9DE">
    <rect x="29" y="45" width="38" height="5" rx="2.5" />
    <rect x="29" y="55" width="24" height="5" rx="2.5" opacity="0.62" />
  </g>

  <!-- the selection -->
  <rect x="12" y="16" width="72" height="64" rx="4" fill="none"
        stroke="#0A84FF" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" />
  <g fill="#FFFFFF" stroke="#0A84FF" stroke-width="3">
    <rect x="6.5" y="10.5" width="11" height="11" rx="3.5" />
    <rect x="78.5" y="10.5" width="11" height="11" rx="3.5" />
    <rect x="6.5" y="74.5" width="11" height="11" rx="3.5" />
    <rect x="78.5" y="74.5" width="11" height="11" rx="3.5" />
  </g>

  <!-- the pin -->
  <circle cx="62" cy="16" r="13" fill="#0A84FF" stroke="#FFFFFF" stroke-width="3.5" />
  <text x="62" y="21.5" text-anchor="middle" fill="#FFFFFF"
        font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="700">1</text>
</svg>
